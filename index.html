<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栏栏菜谱 LanLan Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="#top">
        <span class="nav-logo-emoji">🍳</span>
        <span class="nav-logo-text">栏栏菜谱</span>
      </a>
      <div class="nav-search">
        <span class="nav-search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="搜搜今天吃什么…" aria-label="搜索菜谱">
      </div>
      <div class="nav-avatar" aria-hidden="true">🐾</div>
    </div>
  </header>

  <!-- Hero 横幅 -->
  <section class="hero" id="top">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">栏栏的私房菜谱</h1>
      <p class="hero-subtitle">把爱，做成一道道菜 🧡</p>
      <div class="hero-tags">
        <span>🍳 家常</span>
        <span>🍲 汤羹</span>
        <span>🍰 甜品</span>
        <span>🥢 小食</span>
      </div>
    </div>
  </section>

  <!-- 分类快速导航（由 JS 动态生成） -->
  <nav class="cat-bar" id="catBar" aria-label="菜谱分类"></nav>

  <main class="container">
    <div class="section-head">
      <h2 class="section-title">全部菜谱</h2>
      <span class="section-count" id="recipeCount"></span>
    </div>

    <section class="recipes-grid" id="recipesGrid">
      <!-- 卡片由 JS 注入 -->
    </section>

    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-emoji">🍽️</div>
      <p>没有找到对应的菜谱哦～换个关键词试试？</p>
    </div>
  </main>

  <footer class="footer">
    <p>Made with 🧡 by LanLan · 记录每一次厨房的小幸福</p>
  </footer>

  <!-- 菜谱详情弹窗 -->
  <div class="modal" id="recipeModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" aria-label="关闭">&times;</button>
      <div class="modal-header">
        <span class="modal-category" id="modalCategory"></span>
        <h2 id="modalTitle"></h2>
        <div class="modal-meta">
          <span id="modalTime"></span>
          <span id="modalDifficulty"></span>
        </div>
      </div>
      <div class="modal-body">
        <div class="ingredients">
          <h3>🥬 食材</h3>
          <ul id="modalIngredients"></ul>
        </div>
        <div class="steps">
          <h3>👩‍🍳 做法</h3>
          <ol id="modalSteps"></ol>
        </div>
        <div class="tip" id="modalTip" hidden>
          <h3>💡 小贴士</h3>
          <p></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
